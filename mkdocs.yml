site_name: Kore User Manual
repo_url: https://github.com/repepo/kore
repo_name: repepo/kore

nav:
  - Home: index.md
  - Getting started:
    - Installation: installation.md
    - Quick start: quickstart.md
  - User guide:
    - Setting up a problem: setup.md
    - Background magnetic field: background-field.md
    - Inner core and mantle: boundaries.md
    - Rotational dynamics: rotdyn.md
    - Background flow: bgflow.md
    - Solver settings: solver.md
    - Output and postprocessing: output.md
  - Theory:
    - Equations and scaling: equations.md
    - Numerical method: method.md
  - Examples:
    - Examples and tests: examples.md

theme:
  name: material
  logo: assets/test1.png
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy

  palette: 

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences



extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
