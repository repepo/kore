site_name: User Manual

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - User guide:
      - Background model: background.md
      - Convective forcing: forcing.md
      - Thermal forcing: thermal-forcing.md
      - Tidal forcing: tidal-forcing.md
      - Libration: libration.md
      - Spherical Couette flow: couette-flow.md
      - Background flow: bgflow.md
      - Magnetic field: magnetic.md
      - Rotating solids: rotating-solids.md
      - Drag at the outer wall: drag.md
      - Combining features: compatibility.md
      - Solver: solver.md
      - Output files: output.md
  - Benchmarks: benchmarks.md
  - Mathematical framework:
      - Anelastic equations: anelastic.md
      - Numerical method: numerical-method.md
      - Differential rotation: differential_rotation_details.md
      - Background flow: bgflow-equations.md
      - Centrifugal deformation: centrifugal-equations.md
      - Magnetic field: magnetic-equations.md
      - Rotating solids: rotating-solids-equations.md
      - Drag at the outer wall: drag-equations.md
      - Reynolds-stress forcing: reynolds-stress.md
      - Derivation tools: derivations.md
  - Modifying kore: checking.md

theme:
  name: material
  logo: assets/test1.png
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy

  palette: 

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences



extra_css:
  - stylesheets/compat.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
