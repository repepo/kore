site_name: User Manual

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Anelastic equations: anelastic.md
  - Non-dimensionalization: nondimensionalization.md
  - Background model: background.md
  - Differential rotation:
      - User guide: differential-rotation.md
      - Equations and implementation: differential_rotation_details.md
  - ThermaD = 0: thermad0.md
  - Solver: solver.md
  - Benchmarks: benchmarks.md

theme:
  name: material
  logo: assets/test1.png
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy

  palette: 

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences



extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
