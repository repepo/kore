# The tests of the default branch, main: run on every push to main, on pull requests into it, and from "Run workflow" in
# the Actions tab. conductive_IC has its own tests and workflow (conductive_IC.yml).
# Keep this same file on every branch that may become the default (as with docs.yml and conductive_IC.yml): GitHub
# lists workflows, and serves their badges, from the default branch, so a workflow missing there is marked deleted
# and its badge breaks.
#
# One job: PETSc/SLEPc are installed once, then tests/ci (pytest: the spin-over, the literature benchmarks, the operator
# checks) and six suites of tests/ by their run_all.sh run back to back, one step each (about 9 min of tests in all).
# Until 2026-11-18 each suite was its own job: seven apt installs per push, each a chance for a stalled mirror to hang
# a job until its time limit (as on 69dfb38a). The packages now come from the Actions cache when it has them. The other suites (docs/checking.md) take longer, or need sympy, pandas
# or matplotlib.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'mkdocs.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'mkdocs.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # "Run workflow" can be started on any branch: only test main
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PETSC_DIR: /usr/lib/petscdir/petsc-complex
      SLEPC_DIR: /usr/lib/slepcdir/slepc-complex
    steps:
      - uses: actions/checkout@v5

      # The .deb files and apt's package lists of the last good install, kept in the Actions cache: a run then installs
      # without the network, so a stalled Ubuntu mirror (as on d0c4d3d3, 2026-11-18) no longer stops the tests. The key
      # follows this file, so a change of the package list starts a new cache.
      - name: Restore the cached packages
        id: debcache
        uses: actions/cache/restore@v4
        with:
          path: ~/aptcache
          key: apt-ubuntu-24.04-${{ hashFiles('.github/workflows/anelastic_log.yml') }}
          restore-keys: apt-ubuntu-24.04-

      # Without the cache, or if installing from it fails: from the network, with time limits, so that a hung apt is cut
      # and retried once, from archive.ubuntu.com in place of the runners' own mirror. --no-install-recommends skips ~30
      # packages the tests do not use (sphinx, coarrays, PETSc examples); python3-petsc4py/slepc4py, only recommended,
      # hold the .pth files that make "import petsc4py" pick the complex build from PETSC_DIR, so they are named.
      - name: Install dependencies
        id: deps
        timeout-minutes: 14
        run: |
          pkgs="python3-scipy python3-mpi4py python3-pytest
                libpetsc-complex-dev libslepc-complex-dev
                python3-petsc4py python3-slepc4py python3-petsc4py-complex python3-slepc4py-complex"
          apt="sudo DEBIAN_FRONTEND=noninteractive apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          if compgen -G "$HOME/aptcache/archives/*.deb" > /dev/null; then
            sudo cp -r ~/aptcache/lists/. /var/lib/apt/lists/
            sudo cp ~/aptcache/archives/*.deb /var/cache/apt/archives/
            if timeout 300 $apt install -y --no-install-recommends --no-download $pkgs; then
              echo "installed from the cache"; exit 0
            fi
            echo "::warning::installing from the cache failed, trying the network"
          fi
          for attempt in 1 2; do
            # download first, then install from the download: what the cache keeps (saved below) is then the .deb
            # files themselves, whatever apt's clean-up hooks do after an install
            if timeout 150 $apt update && timeout 300 $apt install -y --no-install-recommends --download-only $pkgs; then
              rm -rf ~/aptcache; mkdir -p ~/aptcache/archives ~/aptcache/lists
              if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
                cp /var/cache/apt/archives/*.deb ~/aptcache/archives/
                sudo cp -r /var/lib/apt/lists/. ~/aptcache/lists/
                sudo rm -rf ~/aptcache/lists/partial ~/aptcache/lists/lock
                sudo chown -R "$(id -u):$(id -g)" ~/aptcache
                echo "network=1" >> "$GITHUB_OUTPUT"
              fi
              timeout 300 $apt install -y --no-install-recommends --no-download $pkgs && exit 0
            fi
            echo "::warning::apt-get attempt $attempt stalled or failed"
            sudo dpkg --configure -a || true
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|' \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          done
          exit 1

      - name: Save the packages to the cache
        if: steps.deps.outputs.network == '1' && steps.debcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/aptcache
          key: apt-ubuntu-24.04-${{ hashFiles('.github/workflows/anelastic_log.yml') }}

      # One step per suite, so the summary shows which one failed; every suite runs even after another one fails
      - name: Run tests/ci
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: tests/ci
        run: |
          ulimit -s unlimited
          pytest -v

      - name: Run tests/decay        # the field and the entropy without the flow (Bessel roots), kinematic induction
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ulimit -s unlimited; bash tests/decay/run_all.sh "$RUNNER_TEMP/decay"
      - name: Run tests/tidal        # forcing 14 against the Stokes solution, the energy budget at the walls
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ulimit -s unlimited; bash tests/tidal/run_all.sh "$RUNNER_TEMP/tidal"
      - name: Run tests/forcing      # the boundary forcings' wall values, and the stops at startup
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ulimit -s unlimited; bash tests/forcing/run_all.sh "$RUNNER_TEMP/forcing"
      - name: Run tests/rotdyn       # the rotating solids and the angular momentum
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ulimit -s unlimited; bash tests/rotdyn/run_all.sh "$RUNNER_TEMP/rotdyn"
      - name: Run tests/inner_core   # B0 'dipole', a conducting inner core, a fluid slipping along it
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ulimit -s unlimited; bash tests/inner_core/run_all.sh "$RUNNER_TEMP/inner_core"
      - name: Run tests/composition  # the composition, against conductive_IC and against the entropy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ulimit -s unlimited; bash tests/composition/run_all.sh "$RUNNER_TEMP/composition"
