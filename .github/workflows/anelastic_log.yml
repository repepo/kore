# The tests of the anelastic_log branch (tests/ci), run on every push to it. They are separate from those of
# conductive_IC: on a push, GitHub runs the workflows of the pushed commit.
# FIX (2026-10-28): keep this same file on every branch that may become the default (as with docs.yml and
# conductive_IC.yml); a workflow missing from the default branch is marked deleted and its badge 404s.
name: anelastic_log tests

on:
  push:
    branches: [anelastic_log]
    paths-ignore: ['**.md', 'docs/**', 'mkdocs.yml']

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PETSC_DIR: /usr/lib/petscdir/petsc-complex
      SLEPC_DIR: /usr/lib/slepcdir/slepc-complex
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-scipy python3-mpi4py python3-pytest \
            libpetsc-complex-dev libslepc-complex-dev \
            python3-petsc4py-complex python3-slepc4py-complex

      - name: Run tests
        working-directory: tests/ci
        run: |
          ulimit -s unlimited
          pytest -v
